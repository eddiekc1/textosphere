name: Deploy via rsync

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. rsync でサーバーにデプロイ
      - name: Deploy with rsync
        uses: Burnett01/rsync-deployments@v8
        with:
          switches: -avz --exclude=".git" --exclude=".github" --exclude=".gitignore" --exclude=".env" --exclude="node_modules" --exclude="uploads" --exclude="card"
          path: /
          remote_path: /home/textosphere/www/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      # 3. ssh でサービス再起動
      - name: Restart Service with SSH
        uses: D3rHase/ssh-command-action@v0.3.1
        with:
          host: ${{ secrets.SSH_HOST }}
          user: ${{ secrets.SSH_USER }}
          private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          command: sudo systemctl restart textosphere
